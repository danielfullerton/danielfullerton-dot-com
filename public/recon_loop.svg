<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="The reconciliation loop: source events flow through transform to output, while an independent reconcile step compares output back to source and replays any drift.">
  <defs>
    <style>
      .plate { fill: #ffffff; stroke: #e4e4de; }
      .box   { fill: #f7f7f4; stroke: #cfcfc8; }
      .accentbox { fill: rgba(30,64,118,0.06); stroke: #1e4076; }
      .ink   { fill: #18191b; font-family: Georgia, 'Times New Roman', serif; }
      .muted { fill: #55575d; font-family: Georgia, 'Times New Roman', serif; }
      .mono  { fill: #6c6e74; font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace; letter-spacing: .12em; }
      .accent{ fill: #1e4076; font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace; letter-spacing: .1em; }
      .stroke-ink { stroke: #35373c; fill: none; }
      .stroke-accent { stroke: #1e4076; fill: none; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#35373c"/>
    </marker>
    <marker id="arrowA" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1e4076"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="618" rx="14" class="plate"/>

  <!-- top row boxes -->
  <g>
    <rect x="40"  y="80" width="270" height="96" rx="10" class="box"/>
    <text x="64" y="112" class="mono" font-size="15">01 — SOURCE</text>
    <text x="64" y="146" class="ink" font-size="24">Raw events</text>

    <rect x="465" y="80" width="270" height="96" rx="10" class="box"/>
    <text x="489" y="112" class="mono" font-size="15">02 — TRANSFORM</text>
    <text x="489" y="146" class="ink" font-size="24">Enrich &amp; rate</text>

    <rect x="890" y="80" width="270" height="96" rx="10" class="box"/>
    <text x="914" y="112" class="mono" font-size="15">03 — OUTPUT</text>
    <text x="914" y="146" class="ink" font-size="24">Charges</text>
  </g>

  <!-- horizontal arrows -->
  <line x1="315" y1="128" x2="460" y2="128" class="stroke-ink" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="128" x2="885" y2="128" class="stroke-ink" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- reconcile node -->
  <rect x="450" y="420" width="300" height="104" rx="10" class="accentbox"/>
  <text x="476" y="454" class="accent" font-size="15">04 — RECONCILE</text>
  <text x="476" y="490" class="ink" font-size="24">Independent check</text>

  <!-- output down into reconcile (right) -->
  <path d="M1025,176 L1025,300 Q1025,472 760,472" class="stroke-ink" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1045" y="300" class="mono" font-size="14">actuals</text>

  <!-- source down into reconcile (left, dashed = expected) -->
  <path d="M175,176 L175,472 L440,472" class="stroke-ink" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#arrow)"/>
  <text x="70" y="300" class="mono" font-size="14">expected</text>

  <!-- replay arrow up to transform (accent) -->
  <path d="M600,420 L600,182" class="stroke-accent" stroke-width="2.5" marker-end="url(#arrowA)"/>
  <text x="616" y="320" class="accent" font-size="15">drift → replay</text>

  <text x="476" y="516" class="muted" font-size="15">compare • quantify • replay</text>
</svg>
