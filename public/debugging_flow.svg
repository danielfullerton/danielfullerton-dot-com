<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Telemetry-first debugging loop: read the signal, drill to one entity, form a hypothesis, run a skeptic's pass; if the root cause does not survive, restart from the signal.">
  <defs>
    <style>
      .plate { fill: #ffffff; stroke: #e4e4de; }
      .box   { fill: #f7f7f4; stroke: #cfcfc8; }
      .accentbox { fill: rgba(30,64,118,0.06); stroke: #1e4076; }
      .ink   { fill: #18191b; font-family: Georgia, 'Times New Roman', serif; }
      .muted { fill: #55575d; font-family: Georgia, 'Times New Roman', serif; }
      .mono  { fill: #6c6e74; font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace; letter-spacing: .12em; }
      .accent{ fill: #1e4076; font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace; letter-spacing: .1em; }
      .stroke-ink { stroke: #35373c; fill: none; }
      .stroke-accent { stroke: #1e4076; fill: none; }
    </style>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#35373c"/>
    </marker>
    <marker id="arrA" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1e4076"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="558" rx="14" class="plate"/>

  <!-- sparkline motif in step 1 -->
  <g>
    <rect x="40" y="150" width="248" height="150" rx="10" class="box"/>
    <text x="64" y="182" class="mono" font-size="14">01 — READ SIGNAL</text>
    <polyline points="64,262 92,254 120,266 148,238 176,270 204,214 232,258 260,250"
              class="stroke-ink" stroke-width="2"/>
    <circle cx="204" cy="214" r="6" fill="#1e4076"/>
    <text x="64" y="290" class="muted" font-size="15">telemetry, not theory</text>
  </g>

  <!-- step 2 -->
  <rect x="336" y="150" width="248" height="150" rx="10" class="box"/>
  <text x="360" y="182" class="mono" font-size="14">02 — DRILL DOWN</text>
  <text x="360" y="222" class="ink" font-size="23">One entity,</text>
  <text x="360" y="252" class="ink" font-size="23">end to end</text>
  <text x="360" y="290" class="muted" font-size="15">aggregates hide it</text>

  <!-- step 3 -->
  <rect x="632" y="150" width="248" height="150" rx="10" class="box"/>
  <text x="656" y="182" class="mono" font-size="14">03 — HYPOTHESIZE</text>
  <text x="656" y="222" class="ink" font-size="23">Retry or real?</text>
  <text x="656" y="252" class="ink" font-size="23">Read the math.</text>
  <text x="656" y="290" class="muted" font-size="15">count vs. outcome</text>

  <!-- step 4 (accent) -->
  <rect x="928" y="150" width="232" height="150" rx="10" class="accentbox"/>
  <text x="952" y="182" class="accent" font-size="14">04 — SKEPTIC PASS</text>
  <text x="952" y="222" class="ink" font-size="23">Try to</text>
  <text x="952" y="252" class="ink" font-size="23">disprove it</text>
  <text x="952" y="290" class="muted" font-size="15">then confirm</text>

  <!-- arrows between steps -->
  <line x1="288" y1="225" x2="334" y2="225" class="stroke-ink" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="584" y1="225" x2="630" y2="225" class="stroke-ink" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="880" y1="225" x2="926" y2="225" class="stroke-ink" stroke-width="2" marker-end="url(#arr)"/>

  <!-- restart loop (dashed, accent) from step 4 back to step 1 -->
  <path d="M1044,300 L1044,400 Q1044,430 1014,430 L194,430 Q164,430 164,400 L164,304"
        class="stroke-accent" stroke-width="2.5" stroke-dasharray="5 6" marker-end="url(#arrA)"/>
  <text x="512" y="422" class="accent" font-size="15">doesn't survive → restart from the signal</text>
</svg>
